<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fic Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0e0c0f;
    --surface: #17141a;
    --surface2: #211d26;
    --border: #2e2935;
    --accent: #c9a0dc;
    --accent2: #8b5fa3;
    --text: #e8e0f0;
    --text-muted: #9b8faa;
    --text-body: #d4cade;
    --font-body: 'Lora', Georgia, serif;
    --font-size: 18px;
    --line-height: 1.85;
    --max-width: 680px;
    --radius: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  [data-theme="light"] {
    --bg: #f5f0eb;
    --surface: #ede7df;
    --surface2: #e0d9d0;
    --border: #ccc3b8;
    --accent: #7a3fa0;
    --accent2: #5c2e80;
    --text: #1a1520;
    --text-muted: #6b5f7a;
    --text-body: #2d2535;
  }

  [data-theme="sepia"] {
    --bg: #f4ede4;
    --surface: #ede4d8;
    --surface2: #e3d8c8;
    --border: #cfc0a8;
    --accent: #8b5e3c;
    --accent2: #6b4428;
    --text: #2c1e10;
    --text-muted: #7a6050;
    --text-body: #3a2818;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    transition: background 0.3s, color 0.3s;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
  .screen.hidden { display: none; }

  /* ── HOME SCREEN ── */
  #home {
    background: var(--bg);
    padding-top: calc(var(--safe-top) + 16px);
    padding-bottom: calc(var(--safe-bottom) + 16px);
  }

  .home-header {
    padding: 20px 24px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .app-title {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    color: var(--text);
    line-height: 1;
  }

  .app-title span {
    color: var(--accent);
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.15s;
    color: var(--text);
  }

  .icon-btn:active { transform: scale(0.93); background: var(--border); }

  .upload-zone {
    margin: 20px 20px 0;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .upload-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent2)10, transparent 60%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .upload-zone:active::before { opacity: 1; }

  .upload-icon { font-size: 28px; margin-bottom: 8px; }

  .upload-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .upload-formats {
    margin-top: 6px;
    font-size: 12px;
    color: var(--accent);
  }

  #fileInput { display: none; }

  .library-header {
    padding: 20px 24px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .library-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .fic-count {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent);
  }

  .library-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px;
    padding-bottom: calc(var(--safe-bottom) + 20px);
    -webkit-overflow-scrolling: touch;
  }

  .fic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
  }

  .fic-card::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .fic-card:active { transform: scale(0.985); background: var(--surface2); }
  .fic-card:active::after { opacity: 1; }

  .fic-thumb {
    width: 42px; height: 58px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent2), var(--border));
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .fic-info { flex: 1; min-width: 0; }

  .fic-title {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fic-meta {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .fic-progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    margin-top: 10px;
    overflow: hidden;
  }

  .fic-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    transition: width 0.3s;
  }

  .fic-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .fic-delete {
    font-size: 14px;
    padding: 4px;
    cursor: pointer;
    color: var(--text-muted);
    opacity: 0.6;
    transition: opacity 0.15s;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 40px;
    text-align: center;
  }

  .empty-icon { font-size: 48px; opacity: 0.4; }

  .empty-text {
    font-family: 'Lora', serif;
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* ── READER SCREEN ── */
  #reader {
    background: var(--bg);
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  .reader-topbar {
    position: absolute;
    top: var(--safe-top);
    left: 0; right: 0;
    height: 52px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 10;
    transition: opacity 0.3s, transform 0.3s;
  }

  .reader-topbar.hidden-bar {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    padding: 8px 4px;
    letter-spacing: 0.04em;
  }

  .reader-title-bar {
    flex: 1;
    font-family: 'DM Serif Display', serif;
    font-size: 14px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  .reader-settings-btn {
    font-size: 16px;
    cursor: pointer;
    padding: 8px 4px;
    color: var(--text-muted);
  }

  .reader-content {
    position: absolute;
    top: calc(var(--safe-top) + 52px);
    left: 0; right: 0;
    bottom: calc(var(--safe-bottom) + 48px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 28px 24px;
  }

  .reader-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    font-family: var(--font-body);
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: var(--text-body);
  }

  .reader-inner h1, .reader-inner h2, .reader-inner h3 {
    font-family: 'DM Serif Display', serif;
    color: var(--text);
    margin: 1.5em 0 0.6em;
    line-height: 1.2;
  }

  .reader-inner h1 { font-size: 1.6em; }
  .reader-inner h2 { font-size: 1.3em; }
  .reader-inner h3 { font-size: 1.1em; color: var(--accent); }

  .reader-inner p {
    margin-bottom: 1.1em;
    text-align: justify;
    hyphens: auto;
  }

  .reader-inner em { font-style: italic; }
  .reader-inner strong { font-weight: 600; color: var(--text); }

  .reader-inner hr {
    border: none;
    text-align: center;
    margin: 2em 0;
    color: var(--accent);
    letter-spacing: 0.4em;
  }

  .reader-inner hr::after { content: '✦ ✦ ✦'; }

  .reader-inner blockquote {
    border-left: 2px solid var(--accent);
    padding-left: 16px;
    margin: 1.2em 0;
    font-style: italic;
    color: var(--text-muted);
  }

  .reader-inner a { color: var(--accent); text-decoration: none; }

  /* Chapter title */
  .chapter-header {
    margin-bottom: 2em;
    padding-bottom: 1.2em;
    border-bottom: 1px solid var(--border);
  }

  .chapter-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .chapter-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--text);
    line-height: 1.2;
  }

  .chapter-author {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
    font-style: italic;
  }

  /* Bottom bar */
  .reader-bottombar {
    position: absolute;
    bottom: var(--safe-bottom);
    left: 0; right: 0;
    height: 48px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    transition: opacity 0.3s, transform 0.3s;
  }

  .reader-bottombar.hidden-bar {
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
  }

  .progress-text {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .progress-track {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.2s;
  }

  /* ── SETTINGS PANEL ── */
  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    backdrop-filter: blur(4px);
  }

  .settings-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .settings-panel {
    width: 100%;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--border);
    padding: 0 20px calc(var(--safe-bottom) + 20px);
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  .settings-overlay.open .settings-panel {
    transform: translateY(0);
  }

  .settings-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 20px;
  }

  .settings-section-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 12px;
    margin-top: 20px;
  }

  /* Theme buttons */
  .theme-row {
    display: flex;
    gap: 10px;
    margin-bottom: 4px;
  }

  .theme-btn {
    flex: 1;
    height: 44px;
    border-radius: 10px;
    border: 2px solid var(--border);
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .theme-btn[data-t="dark"] { background: #0e0c0f; color: #e8e0f0; }
  .theme-btn[data-t="light"] { background: #f5f0eb; color: #1a1520; }
  .theme-btn[data-t="sepia"] { background: #f4ede4; color: #2c1e10; }
  .theme-btn.active { border-color: var(--accent); }

  /* Font selector */
  .font-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .font-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .font-btn[data-f="lora"] { font-family: 'Lora', serif; }
  .font-btn[data-f="crimson"] { font-family: 'Crimson Pro', serif; }
  .font-btn[data-f="garamond"] { font-family: 'EB Garamond', serif; }
  .font-btn.active { border-color: var(--accent); color: var(--accent); background: var(--surface); }

  /* Size slider */
  .size-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .size-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }

  /* Line height slider */
  .lh-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 12px;
  }

  /* ── LOADING ── */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .loading-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .loading-spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 70px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text);
    z-index: 300;
    opacity: 0;
    transition: all 0.25s;
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Scrollbar */
  .reader-content::-webkit-scrollbar { width: 2px; }
  .reader-content::-webkit-scrollbar-track { background: transparent; }
  .reader-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 1px; }

  .library-list::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen">
  <div class="home-header">
    <div class="app-title">fic<span>.</span>reader</div>
    <div class="header-actions">
      <div class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Agregar archivo">＋</div>
    </div>
  </div>

  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📖</div>
    <div class="upload-label">Abrir fanfic</div>
    <div class="upload-formats">EPUB · HTML · PDF · TXT · MOBI</div>
  </div>
  <input type="file" id="fileInput" accept=".epub,.html,.htm,.pdf,.txt,.mobi,.azw,.azw3" multiple>

  <div class="library-header">
    <div class="library-title">Biblioteca</div>
    <div class="fic-count" id="ficCount">0 fics</div>
  </div>

  <div class="library-list" id="libraryList">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🕯️</div>
      <div class="empty-text">Tu biblioteca está vacía.<br>Descarga tus fanfics de AO3<br>y ábrelos aquí.</div>
    </div>
  </div>
</div>

<!-- READER -->
<div id="reader" class="screen hidden">
  <div class="reader-topbar" id="readerTopbar">
    <div class="back-btn" onclick="goHome()">← INICIO</div>
    <div class="reader-title-bar" id="readerTitleBar">—</div>
    <div class="reader-settings-btn" onclick="openSettings()">⚙︎</div>
  </div>

  <div class="reader-content" id="readerContent" onclick="toggleBars()">
    <div class="reader-inner" id="readerInner"></div>
  </div>

  <div class="reader-bottombar" id="readerBottombar">
    <div class="progress-text" id="progressText">0%</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsOutside(event)">
  <div class="settings-panel">
    <div class="settings-handle"></div>

    <div class="settings-section-title">Tema</div>
    <div class="theme-row">
      <button class="theme-btn active" data-t="dark" onclick="setTheme('dark')">🌙 Oscuro</button>
      <button class="theme-btn" data-t="light" onclick="setTheme('light')">☀️ Claro</button>
      <button class="theme-btn" data-t="sepia" onclick="setTheme('sepia')">📜 Sepia</button>
    </div>

    <div class="settings-section-title">Tipografía</div>
    <div class="font-row">
      <button class="font-btn active" data-f="lora" onclick="setFont('lora')">Lora</button>
      <button class="font-btn" data-f="crimson" onclick="setFont('crimson')">Crimson</button>
      <button class="font-btn" data-f="garamond" onclick="setFont('garamond')">Garamond</button>
    </div>

    <div class="settings-section-title">Tamaño de texto</div>
    <div class="size-row">
      <div class="size-label">A</div>
      <input type="range" id="sizeSlider" min="14" max="26" value="18" oninput="setFontSize(this.value)">
      <div class="size-label" style="font-size:15px">A</div>
    </div>

    <div class="settings-section-title">Interlineado</div>
    <div class="lh-row">
      <div class="size-label">≡</div>
      <input type="range" id="lhSlider" min="140" max="240" value="185" oninput="setLineHeight(this.value)">
      <div class="size-label">≡≡</div>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Procesando...</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let library = JSON.parse(localStorage.getItem('ficLibrary') || '[]');
let prefs = JSON.parse(localStorage.getItem('ficPrefs') || '{}');
let currentFic = null;
let barsVisible = true;

// ── INIT ──
renderLibrary();
applyPrefs();

// ── FILE INPUT ──
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  for (const file of files) await processFile(file);
  e.target.value = '';
});

async function processFile(file) {
  showLoading(`Leyendo ${file.name}...`);
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let content = '';
    let title = file.name.replace(/\.[^.]+$/, '');

    if (ext === 'txt') {
      content = await readText(file);
      content = txtToHtml(content);
    } else if (ext === 'html' || ext === 'htm') {
      const raw = await readText(file);
      // Extract title from raw HTML before cleaning
      const titleMatch = raw.match(/<title[^>]*>([^<]+)<\/title>/i);
      if (titleMatch) title = titleMatch[1].replace(/\s*[:\-–|]\s*(An Archive.*|AO3|Archive of Our Own).*/i, '').trim();
      content = cleanHtml(raw);
    } else if (ext === 'epub') {
      content = await readEpub(file);
    } else if (ext === 'pdf') {
      content = await readPdf(file);
    } else if (ext === 'mobi' || ext === 'azw' || ext === 'azw3') {
      content = await readMobi(file);
    } else {
      content = await readText(file);
      content = txtToHtml(content);
    }

    const fic = {
      id: Date.now() + Math.random(),
      title,
      format: ext.toUpperCase(),
      added: new Date().toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' }),
      size: formatSize(file.size),
      content,
      progress: 0,
      emoji: randomEmoji()
    };

    library.unshift(fic);
    saveLibrary();
    renderLibrary();
    showToast(`"${title}" agregado ✦`);
  } catch (err) {
    showToast('Error: ' + (err.message || 'No se pudo leer') + ' 😓');
    console.error(err);
  }
  hideLoading();
}

// ── READERS ──
function readText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsText(file, 'UTF-8');
  });
}

function readArrayBuffer(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsArrayBuffer(file);
  });
}

function txtToHtml(text) {
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const paragraphs = escaped.split(/\n\n+/).map(p => {
    const line = p.trim().replace(/\n/g,' ');
    if (!line) return '';
    if (line.match(/^(Chapter|Capítulo|Part|Parte)\s+\d+/i) || line.match(/^={3,}$|^-{3,}$/)) {
      return `<h2>${line}</h2>`;
    }
    if (line === '* * *' || line === '---' || line === '***') return '<hr>';
    return `<p>${line}</p>`;
  });
  return paragraphs.join('');
}

function cleanHtml(raw) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(raw, 'text/html');

    // AO3-specific selectors first, then generic fallbacks
    let root =
      doc.querySelector('#workskin') ||
      doc.querySelector('.userstuff') ||
      doc.querySelector('[role="main"]') ||
      doc.querySelector('main') ||
      doc.querySelector('article') ||
      doc.querySelector('.chapter') ||
      doc.body;

    if (!root) return '<p>No se pudo extraer el contenido.</p>';

    // Remove noise
    [
      'script','style','nav','header','footer','form',
      '.header','#header','.footer','#footer',
      '#navigation','#chapter-index','.chapter-index',
      '#admin-banner','.flash','.actions',
      '.bookmark','.kudos','#comments',
      '#kudos-summary','.work-meta',
    ].forEach(sel => {
      try { root.querySelectorAll(sel).forEach(el => el.remove()); } catch(e) {}
    });

    // Get clean innerHTML
    let html = root.innerHTML;

    // Strip attributes from safe tags
    html = html.replace(/<(p|h[1-6]|em|strong|i|b|br|hr|blockquote)(\s[^>]*)?>/gi, '<$1>');
    // Convert block elements to paragraphs
    html = html.replace(/<(div|section|article|main|aside)(\s[^>]*)?>/gi, '<p>');
    html = html.replace(/<\/(div|section|article|main|aside)>/gi, '</p>');
    // Remove links but keep text
    html = html.replace(/<a[^>]*>/gi, '');
    html = html.replace(/<\/a>/gi, '');
    // Remove spans
    html = html.replace(/<span[^>]*>/gi, '');
    html = html.replace(/<\/span>/gi, '');
    // Clean up
    html = html.replace(/<p>\s*<\/p>/gi, '');
    html = html.replace(/(<br\s*\/?>\s*){3,}/gi, '<hr>');

    return html.trim() || '<p>No se encontró texto en este archivo.</p>';
  } catch(e) {
    // Regex fallback
    const bodyMatch = raw.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    let content = bodyMatch ? bodyMatch[1] : raw;
    content = content.replace(/<script[\s\S]*?<\/script>/gi, '');
    content = content.replace(/<style[\s\S]*?<\/style>/gi, '');
    content = content.replace(/<[^>]+>/g, ' ');
    return content.split(/\n\n+/).map(p => p.trim() ? `<p>${p.trim()}</p>` : '').join('');
  }
}

async function readEpub(file) {
  showLoading('Desempaquetando EPUB...');
  try {
    const { default: JSZip } = await import('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const ab = await readArrayBuffer(file);
    const zip = await JSZip.loadAsync(ab);

    // Find OPF
    let opfPath = '';
    const containerXml = await zip.file('META-INF/container.xml')?.async('text');
    if (containerXml) {
      const m = containerXml.match(/full-path="([^"]+\.opf)"/i);
      if (m) opfPath = m[1];
    }
    if (!opfPath) opfPath = Object.keys(zip.files).find(f => f.endsWith('.opf')) || '';
    
    const opfDir = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';
    
    // Parse OPF for spine order
    let htmlFiles = [];
    if (opfPath && zip.file(opfPath)) {
      const opf = await zip.file(opfPath).async('text');
      const idmap = {};
      const manifestRe = /<item\s+[^>]*id="([^"]+)"[^>]*href="([^"]+)"[^>]*/gi;
      let mm;
      while ((mm = manifestRe.exec(opf)) !== null) {
        idmap[mm[1]] = mm[2];
      }
      const spineRe = /<itemref\s+idref="([^"]+)"/gi;
      while ((mm = spineRe.exec(opf)) !== null) {
        const href = idmap[mm[1]];
        if (href && (href.endsWith('.html') || href.endsWith('.htm') || href.endsWith('.xhtml'))) {
          htmlFiles.push(opfDir + href);
        }
      }
    }

    if (!htmlFiles.length) {
      htmlFiles = Object.keys(zip.files).filter(f =>
        (f.endsWith('.html') || f.endsWith('.htm') || f.endsWith('.xhtml')) && !f.includes('toc') && !f.includes('nav')
      ).sort();
    }

    let combined = '';
    for (const path of htmlFiles) {
      const f = zip.file(path) || zip.file(decodeURIComponent(path));
      if (f) {
        const html = await f.async('text');
        combined += cleanHtml(html) + '<hr>';
      }
    }
    return combined || '<p>No se pudo extraer el contenido del EPUB.</p>';
  } catch (e) {
    console.error('EPUB error:', e);
    return '<p>Error al procesar el EPUB. Intenta con el formato HTML.</p>';
  }
}

async function readPdf(file) {
  showLoading('Extrayendo texto del PDF...');
  try {
    const pdfjsLib = await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
      s.type = 'module';
      document.head.appendChild(s);
      s.onload = () => res(window.pdfjsLib);
      s.onerror = rej;
      // Fallback: use importmap-style dynamic import
      setTimeout(() => res(null), 3000);
    }).catch(() => null);

    // Try alternative approach
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    await new Promise(r => { script.onload = r; script.onerror = r; document.head.appendChild(script); });
    
    if (typeof pdfjsLib === 'undefined' && typeof window.pdfjsLib === 'undefined') {
      return '<p>⚠️ Para PDFs, descarga el fanfic en formato HTML o TXT desde AO3 para mejor compatibilidad.</p>';
    }
    
    const lib = window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    const ab = await readArrayBuffer(file);
    const pdf = await lib.getDocument(ab).promise;
    let text = '';
    
    for (let i = 1; i <= pdf.numPages; i++) {
      showLoading(`Página ${i}/${pdf.numPages}...`);
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      text += pageText + '\n\n';
    }
    
    return txtToHtml(text);
  } catch (e) {
    console.error('PDF error:', e);
    return '<p>⚠️ No se pudo leer este PDF. Recomendación: descarga el fanfic en formato <strong>HTML</strong> desde AO3, funciona mejor.</p>';
  }
}

async function readMobi(file) {
  return '<p>⚠️ Los archivos MOBI tienen protección que impide leerlos directamente en el navegador.<br><br>💡 <strong>Tip:</strong> Desde AO3, descarga el mismo fanfic en formato <strong>EPUB</strong> o <strong>HTML</strong> en su lugar.</p>';
}

// ── LIBRARY ──
function renderLibrary() {
  const list = document.getElementById('libraryList');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('ficCount');
  
  count.textContent = `${library.length} fic${library.length !== 1 ? 's' : ''}`;

  if (!library.length) {
    empty.style.display = 'flex';
    // Remove cards
    [...list.querySelectorAll('.fic-card')].forEach(el => el.remove());
    return;
  }
  
  empty.style.display = 'none';
  list.innerHTML = '';

  library.forEach(fic => {
    const card = document.createElement('div');
    card.className = 'fic-card';
    card.innerHTML = `
      <div class="fic-thumb">${fic.emoji}</div>
      <div class="fic-info">
        <div class="fic-title">${escHtml(fic.title)}</div>
        <div class="fic-meta">${fic.format} · ${fic.size} · ${fic.added}</div>
        <div class="fic-progress-bar">
          <div class="fic-progress-fill" style="width:${fic.progress || 0}%"></div>
        </div>
      </div>
      <div class="fic-actions">
        <div class="fic-delete" onclick="deleteFic(event, '${fic.id}')">✕</div>
        <div class="fic-meta">${Math.round(fic.progress || 0)}%</div>
      </div>
    `;
    card.addEventListener('click', () => openFic(fic.id));
    list.appendChild(card);
  });
}

function deleteFic(e, id) {
  e.stopPropagation();
  library = library.filter(f => f.id != id);
  saveLibrary();
  renderLibrary();
  showToast('Fic eliminado');
}

function saveLibrary() {
  try {
    localStorage.setItem('ficLibrary', JSON.stringify(library));
  } catch(e) {
    // Storage full - keep last 5
    library = library.slice(0, 5);
    localStorage.setItem('ficLibrary', JSON.stringify(library));
    showToast('Espacio lleno, se guardaron los últimos 5');
  }
}

// ── READER ──
function openFic(id) {
  currentFic = library.find(f => f.id == id);
  if (!currentFic) return;

  document.getElementById('readerTitleBar').textContent = currentFic.title;
  document.getElementById('readerInner').innerHTML = `
    <div class="chapter-header">
      <div class="chapter-tag">✦ AO3 Fanfic</div>
      <div class="chapter-title">${escHtml(currentFic.title)}</div>
    </div>
    ${currentFic.content}
  `;

  document.getElementById('home').classList.add('hidden');
  document.getElementById('reader').classList.remove('hidden');

  const content = document.getElementById('readerContent');
  // Restore position
  setTimeout(() => {
    const pct = currentFic.progress || 0;
    content.scrollTop = (content.scrollHeight - content.clientHeight) * (pct / 100);
  }, 100);

  content.addEventListener('scroll', onScroll);
  barsVisible = true;
}

function onScroll() {
  const content = document.getElementById('readerContent');
  const max = content.scrollHeight - content.clientHeight;
  const pct = max > 0 ? Math.round((content.scrollTop / max) * 100) : 0;
  
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';

  // Save progress
  if (currentFic) {
    currentFic.progress = pct;
    const idx = library.findIndex(f => f.id == currentFic.id);
    if (idx >= 0) library[idx].progress = pct;
    saveLibrary();
  }
}

function toggleBars() {
  barsVisible = !barsVisible;
  const top = document.getElementById('readerTopbar');
  const bot = document.getElementById('readerBottombar');
  if (barsVisible) {
    top.classList.remove('hidden-bar');
    bot.classList.remove('hidden-bar');
  } else {
    top.classList.add('hidden-bar');
    bot.classList.add('hidden-bar');
  }
}

function goHome() {
  document.getElementById('readerContent').removeEventListener('scroll', onScroll);
  document.getElementById('reader').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderLibrary();
}

// ── SETTINGS ──
function openSettings() {
  document.getElementById('settingsOverlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function closeSettingsOutside(e) {
  if (e.target === document.getElementById('settingsOverlay')) closeSettings();
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  prefs.theme = t;
  savePrefs();
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
}

function setFont(f) {
  const fonts = {
    lora: "'Lora', Georgia, serif",
    crimson: "'Crimson Pro', Georgia, serif",
    garamond: "'EB Garamond', Georgia, serif"
  };
  document.documentElement.style.setProperty('--font-body', fonts[f]);
  prefs.font = f;
  savePrefs();
  document.querySelectorAll('.font-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
}

function setFontSize(v) {
  document.documentElement.style.setProperty('--font-size', v + 'px');
  prefs.fontSize = v;
  savePrefs();
}

function setLineHeight(v) {
  document.documentElement.style.setProperty('--line-height', (v / 100));
  prefs.lineHeight = v;
  savePrefs();
}

function savePrefs() {
  localStorage.setItem('ficPrefs', JSON.stringify(prefs));
}

function applyPrefs() {
  if (prefs.theme) setTheme(prefs.theme);
  if (prefs.font) setFont(prefs.font);
  if (prefs.fontSize) {
    setFontSize(prefs.fontSize);
    document.getElementById('sizeSlider').value = prefs.fontSize;
  }
  if (prefs.lineHeight) {
    setLineHeight(prefs.lineHeight);
    document.getElementById('lhSlider').value = prefs.lineHeight;
  }
}

// ── UTILS ──
function showLoading(msg) {
  document.getElementById('loadingText').textContent = msg;
  document.getElementById('loadingOverlay').classList.add('show');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function randomEmoji() {
  const emojis = ['🌙','✦','🌸','🩸','🕯️','🗡️','🌿','⚡','🌊','🔮','🌺','💀','🦋','🌑','⭐'];
  return emojis[Math.floor(Math.random() * emojis.length)];
}
